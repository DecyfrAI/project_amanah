# Reviewed source catalogue (B-S8.9).
#
# This file is configuration, not documentation. Nothing collects from a source
# that is absent here, and no seed runs while its source is disabled. It holds no
# secrets: provider credentials stay in the environment, and a connector with no
# key disables itself whatever this file says.
#
# The news outlets below are exactly the feeds reviewed in
# docs/news-rss-sources.md on 23 August 2026. Feeds that document checked and
# rejected -- Reuters, AP, the old CTV path -- are deliberately absent, and
# replacing them with a guess is prohibited.

config_version: "2026.08.23"

sources:
  - source_key: fixtures
    kind: social
    platform: youtube
    name: "Deterministic fixtures"
    purpose: "Synthetic and redacted records that prove the pipeline end to end without contacting any provider."
    retention_policy: indefinite_permitted
    is_enabled: true
    homepage_url: null
    policy_url: null

  - source_key: youtube
    kind: social
    platform: youtube
    name: "YouTube"
    purpose: "Bounded video and comment collection from approved seeds and queries through the official Data API."
    retention_policy: limited_by_terms
    is_enabled: false
    homepage_url: https://www.youtube.com
    policy_url: https://www.youtube.com/t/terms

  - source_key: user_submission
    kind: user_submission
    platform: user_submitted
    name: "User-submitted URLs"
    purpose: "Public URLs an authenticated user asked the product to analyse."
    retention_policy: delete_on_request
    is_enabled: true
    homepage_url: null
    policy_url: null

  - source_key: open_datapack
    kind: open_datapack
    platform: not_applicable
    name: "N/A"
    purpose: "Reviewed open datasets imported under a recorded licence. Public source and platform display as N/A while dataset lineage is kept in its own fields."
    retention_policy: limited_by_terms
    is_enabled: true
    homepage_url: null
    policy_url: null

  - source_key: rss_bbc_news
    kind: news
    platform: news_web
    name: "BBC News"
    purpose: "Reviewed public RSS or Atom feeds from BBC News. Stored as headline metadata and a short permitted excerpt with a link back, never as full article text."
