name: Security gates

on:
  pull_request:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked --project backend --all-groups
      - run: npm ci --prefix apps/web
      - run: uv run --project backend python backend/scripts/security_scan.py
      - run: mkdir -p work
      - run: >-
          uv export --locked --project backend --no-dev --no-emit-project
          --format requirements-txt --output-file work/backend-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --requirement work/backend-requirements.txt --format cyclonedx-json --output work/backend-sbom.json
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high
      - run: npm query "*" --prefix apps/web > work/frontend-dependencies.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            work/backend-sbom.json
            work/frontend-dependencies.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Migration, RLS, and anonymous-denial gates
        env:
          AMANAH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          uv run --project backend pytest
          backend/tests/db/test_migrations.py
          backend/tests/db/test_row_level_security.py
          backend/tests/db/test_authenticated_projections.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
