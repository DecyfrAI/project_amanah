<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable=no and no maximum-scale: zoom must never be disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Project Amanah, monitoring anti-Muslim hate online</title>
    <meta
      name="description"
      content="Project Amanah turns authorized public signals into trends, narratives, context and reviewable reports, without profiling people."
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />

    <meta name="theme-color" content="#071A2B" />

    <!--
      Brand system 5: Inter for UI, Source Serif 4 for editorial summaries,
      IBM Plex Mono for identifiers and timestamps. Preconnect first so the
      font request does not wait on DNS and TLS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap"
    />
  </head>
  <body>
    <!--
      Sets the theme before first paint. Without this the loading screen renders
      in the dark set on a machine with a dark system preference, then snaps to
      light when React mounts. Light is the default. tokens.css applies its dark
      set when data-theme is dark, and also when the system prefers dark and
      light has not been chosen, so the attribute has to be written even for
      light. color-scheme follows the same attribute so native controls match.
    -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('amanah.theme');
        } catch (error) {
          stored = null;
        }
        document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
