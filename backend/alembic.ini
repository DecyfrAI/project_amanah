; Alembic configuration for the Amanah relational store.
;
; Migrations are a separate one-off process, never part of application startup:
;   uv run --project backend --env-file backend/.env alembic -c backend/alembic.ini upgrade head
;
; The connection URL is deliberately absent. `migrations/env.py` reads
; DATABASE_URL from the environment so a connection string is never committed.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
timezone = UTC
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
